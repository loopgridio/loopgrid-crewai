name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release version and repository files
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/release_check.py --tag "$RELEASE_TAG"
      - name: Install and test
        run: |
          python -m pip install -e '.[dev]'
          python -m pip check
          python -m pytest -q
          python -m compileall -q src examples tests
      - name: Build and validate wheel/sdist
        run: |
          python -m build
          python -m twine check dist/*
      - name: Upload exact tested distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI with Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/loopgrid-crewai/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI using OIDC (no API token)
        uses: pypa/gh-action-pypi-publish@release/v1

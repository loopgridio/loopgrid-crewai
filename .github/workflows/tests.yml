name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-packaging:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Check dependencies
        run: python -m pip check
      - name: Unit and regression tests (38)
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src examples tests
      - name: Build distributions
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
        shell: bash
      - name: Install built wheel (non-editable)
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
        shell: bash
      - name: Verify wheel import
        run: python -c "from loopgrid_crewai import LoopGridCrewAI; print(LoopGridCrewAI.__name__)"
      # Native CrewAI sandboxes and signed LoopGrid Core scenarios were
      # separately validated on Windows; CI does not claim to run Core E2Es.

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopgrid-crewai"
version = "0.1.0"
description = "Signed, tamper-evident decision evidence for CrewAI Agents using LoopGrid"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{name = "LoopGrid"}]
keywords = ["crewai", "agent-governance", "decision-evidence", "audit-trail", "tamper-evident", "loopgrid"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["crewai>=1.15.25,<1.16", "loopgrid>=0.8.0,<0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://loopgrid.io/"
Repository = "https://github.com/loopgridio/loopgrid-crewai"
Issues = "https://github.com/loopgridio/loopgrid-crewai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
